#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "rumdl", name = "lint Markdown", entry = "rumdl check", language = "system", types = ["markdown"] },
    { id = "golangci-format", name = "check Go formatting", entry = "golangci-lint fmt --diff", language = "system", files = "(^|/)(go\\.mod|go\\.sum|.*\\.go)$", pass_filenames = false },
    { id = "golangci-lint", name = "lint Go", entry = "golangci-lint run", language = "system", files = "(^|/)(go\\.mod|go\\.sum|.*\\.go)$", pass_filenames = false },
    { id = "go-test", name = "test Go", entry = "go test ./...", language = "system", files = "(^|/)(go\\.mod|go\\.sum|.*\\.go)$", pass_filenames = false },
]

[[repos]]
repo = "."
rev = "223ef48324f3e9c1cb238a27f725232f8417f0b0"
hooks = [
    { id = "lane-keeper-starlark-lint" },
    { id = "lane-keeper-starlark-fmt" },
]
