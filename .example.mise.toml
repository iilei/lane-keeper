# Template for merging into a consuming repository mise.toml

[tools]
lane-keeper = "0.1.0"

[_]

[_.lane-keeper]
version = 1

[_.lane-keeper.defaults]
remote = "origin"
await_interval = "30s"
await_timeout = "30m"

[_.lane-keeper.defaults.template_date_formats]
releaseStamp = "2006.01.02"

# Functions/data reused across check predicates via the namespaced `shared`
# value. This block MUST NOT reference workflow, input, git, succeed, or fail.
[_.lane-keeper.shared]
source = """
benign_patterns = [
    "*.md",
    "*.txt",
    ".github/**",
    ".gitignore",
    ".gitattributes",
    "docs/**",
    "LICENSE",
]

def matches_any_pattern(filename, patterns):
    for pattern in patterns:
        if pattern.endswith("/**"):
            prefix = pattern[:-3]
            if filename.startswith(prefix + "/"):
                return True
        elif "*" in pattern:
            ext = pattern.replace("*.", ".")
            if filename.endswith(ext):
                return True
        elif filename == pattern:
            return True
    return False
"""

[_.lane-keeper.checks.benign-changes-only-on-target-since-baseline]
description = "Only benign (non-environment-determining) changes exist on the target branch since its release baseline"

# For highlighted MyST documentation, use a literalinclude directive with
# language: starlark and the unique start-after/end-before markers below.
predicate = """
# starlark:benign-changes-only-on-target-since-baseline:start
target = workflow.target_branch
baseline = git.latest_tag(target)

if baseline == None:
    fail("no baseline tag found on %s" % target, exit_code = 10)

diff = git.diff(baseline, target)

if diff.is_empty:
    succeed()

disallowed = [f for f in diff.files if not shared.matches_any_pattern(f, shared.benign_patterns)]

if len(disallowed) > 0:
    fail("non-benign target changes since baseline: %s" % ", ".join(disallowed), exit_code = 11)

succeed()
# starlark:benign-changes-only-on-target-since-baseline:end
"""

[_.lane-keeper.templates.contribution-branch]
template = """{{ if .ticket }}{{ .ticket }}-{{ end }}{{ if .environment }}{{ .environment }}{{ else }}notarget-env{{ end }}-{{ .commitAuthorDate | date "yyMMdd" }}-{{ .shortSha }}"""

[_.lane-keeper.templates.merge-request-message]
title = "{{ if .ticket }}{{ .ticket }}: {{ end }}Prepare {{ if .environment }}{{ .environment }}{{ else }}notarget-env{{ end }} contribution{{ if .version }} version{{ .version }}{{ end }}"
body = """
Source commit: {{ .shortSha }}
Target branch: {{ .targetBranch }}
"""

[_.lane-keeper.workflows.release]
description = "Prepare a release contribution from the current source revision"
checks = ["benign-changes-only-on-target-since-baseline"]
remote = "origin"
target_branch = { resolve = "git-remote-head" }
branch_template = "contribution-branch"
merge_request_template = "merge-request-message"

[_.lane-keeper.workflows.release.await]
interval = "30s"
timeout = "15m"

[tasks."check:readiness"]
description = "Evaluate release workflow readiness once"
run = "lane-keeper readiness check --workflow release"

[tasks."await:readiness"]
description = "Await release workflow readiness"
run = "lane-keeper readiness await --workflow release"

[tasks."tmpl:branch-name"]
description = "Render the release contribution branch name"
run = "lane-keeper branch name --workflow release"

[tasks."tmpl:merge-req-message"]
description = "Render the release merge-request title and body"
run = "lane-keeper mr render --workflow release"
