# Template for merging into a consuming repository mise.toml

[tools]
lane-keeper = "0.1.0"

[_]

[_.lane-keeper]
version = 1

[_.lane-keeper.defaults]
remote = "origin"
wait_interval = "30s"

[_.lane-keeper.checks.target-ready]
description = "Whether the target branch has a release baseline and subsequent changes"
predicate = """
target = workflow.target_branch
baseline = git.latest_tag(target)

if baseline == None:
    fail("no baseline tag found on " + target)

if git.diff(baseline, target).is_empty:
    fail("no relevant changes since " + baseline)

pass({
    "baseline": baseline,
    "target": target,
})
"""

[_.lane-keeper.templates.contribution-branch]
template = "{{ if .ticket }}{{ .ticket }}-{{ end }}{{ if .environment }}{{ .environment }}{{ else }}notarget-env{{ end }}-{{ .yyMMdd }}-{{ .shortSha }}"

[_.lane-keeper.templates.merge-request-message]
title = "{{ if .ticket }}{{ .ticket }}: {{ end }}Prepare {{ .environment }} contribution"
body = """
Source commit: {{ .shortSha }}
Target branch: {{ .target_branch }}
"""

[_.lane-keeper.workflows.release]
description = "Prepare a release contribution from the current source revision"
checks = ["target-ready"]
remote = "origin"
target_branch_resolver = "git-remote-head"
branch_template = "contribution-branch"
merge_request_template = "merge-request-message"

[_.lane-keeper.workflows.release.wait]
interval = "30s"

[tasks."check:preflight"]
description = "Evaluate the target-branch preflight once"
run = "lane-keeper preflight check release"

[tasks."wait:preflight"]
description = "Wait until the target-branch preflight passes"
run = "lane-keeper preflight wait release"

[tasks."tmpl:branch-name"]
description = "Render the release contribution branch name"
run = "lane-keeper branch name release"

[tasks."tmpl:merge-req-message"]
description = "Render the release merge-request title and body"
run = "lane-keeper mr render release"

[tasks."git:create-mr-when-ready"]
description = "Create or reuse a merge request after preflight succeeds"
run = "lane-keeper mr create-when-ready release"
